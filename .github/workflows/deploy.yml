name: Pruebas y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruebas-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm run test:run

      - name: Pruebas node
        run: npm run test:node

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas en navegador
        run: npm run test:browser:run

      - name: Ruta base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "BASE_PATH=/" >> $GITHUB_ENV; else echo "BASE_PATH=/$REPO/" >> $GITHUB_ENV; fi

      - name: Build
        run: npm run build

      - name: 404 para rutas SPA
        run: cp dist/index.html dist/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  despliegue:
    needs: pruebas-y-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
